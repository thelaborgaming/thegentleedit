<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quotation Builder — The Gentle Edit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,700;1,9..144,300&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,300&display=swap" rel="stylesheet">
<style>
/* ─── LAYOUT HEIGHTS (for sticky calc) ──────────────── */
:root{--header-h:62px;--toolbar-h:54px;--search-h:41px;--cat-h:48px;}

/* ─── VARIABLES ─────────────────────────────────────── */
:root[data-theme="light"]{
  --bg:#F4F1EC;--bg-surface:#FDFAF5;--bg-card:#FFFFFF;--bg-toolbar:#F0ECE4;
  --border:#E2DDD4;--border-focus:#8B6F47;
  --text-primary:#1C1714;--text-secondary:#6B5E52;--text-muted:#9E8E82;
  --accent:#8B6F47;--accent-light:#F5EFE6;--accent-hover:#6D5535;
  --danger:#C0392B;--success:#27AE60;--warning:#E67E22;
  --pl-pos:#2E7D32;--pl-neg:#C62828;--maroon:#7B1818;
  --shadow-sm:0 1px 3px rgba(28,23,20,.07);--shadow-md:0 4px 16px rgba(28,23,20,.09);--shadow-lg:0 12px 40px rgba(28,23,20,.18);
  --radius-sm:6px;--radius-md:10px;--radius-lg:16px;
  --font-display:'Fraunces',Georgia,serif;--font-body:'DM Sans',sans-serif;--font-mono:'DM Mono',monospace;
}
:root[data-theme="dark"]{
  --bg:#1E1A16;--bg-surface:#252018;--bg-card:#2D2820;--bg-toolbar:#332E26;
  --border:#3D3730;--border-focus:#C9A87A;
  --text-primary:#F0EAE0;--text-secondary:#B0A090;--text-muted:#7A6E64;
  --accent:#C9A87A;--accent-light:#332C20;--accent-hover:#E0C090;
  --danger:#E57373;--success:#66BB6A;--warning:#FFA726;
  --pl-pos:#66BB6A;--pl-neg:#EF5350;--maroon:#E57373;
  --shadow-sm:0 1px 3px rgba(0,0,0,.25);--shadow-md:0 4px 16px rgba(0,0,0,.35);--shadow-lg:0 12px 40px rgba(0,0,0,.5);
}
/* ─── RESET ─────────────────────────────────────────── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-body);background:var(--bg);color:var(--text-primary);min-height:100vh;font-size:14px;line-height:1.5;transition:background .3s,color .3s}
input,textarea,select,button{font-family:inherit;font-size:inherit}
input[type=number]::-webkit-inner-spin-button{opacity:.4}

/* ─── HEADER ────────────────────────────────────────── */
.header{background:var(--bg-card);border-bottom:1px solid var(--border);padding:0 24px;height:62px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:300;box-shadow:var(--shadow-sm);transform:translateZ(0);-webkit-backface-visibility:hidden;will-change:transform}
.brand{display:flex;align-items:center;gap:14px}
.brand-logo{height:42px;width:auto;object-fit:contain}
.brand-text{}
.brand-name{font-family:var(--font-display);font-weight:500;font-size:15px;letter-spacing:.04em;line-height:1.2}
.brand-sub{font-size:10px;color:var(--text-muted);letter-spacing:.06em;text-transform:uppercase;margin-top:1px}
.header-right{display:flex;align-items:center;gap:8px}
.btn-theme{background:var(--bg-toolbar);border:1px solid var(--border);border-radius:var(--radius-sm);padding:6px 11px;cursor:pointer;color:var(--text-secondary);font-size:12px;transition:all .2s;display:flex;align-items:center;gap:5px}
.btn-theme:hover{background:var(--accent-light);color:var(--accent);border-color:var(--accent)}

/* ─── LAYOUT ────────────────────────────────────────── */
.app-body{max-width:1380px;margin:0 auto;padding:22px 18px;display:grid;grid-template-columns:1fr 306px;gap:18px;align-items:start}
@media(max-width:940px){
  .app-body{grid-template-columns:1fr}
  /* Below tablet-portrait width there isn't enough viewport height to spend ~165px
     on four stacked sticky bars (page header + toolbar + category + area). Drop the
     three inner levels to static so content isn't squeezed, and this also sidesteps
     the sticky-offset gap/overlap bug entirely on the devices where it's tightest. */
  .li-toolbar,.cat-sec-header,.area-sub-header{position:static}
  .right-sticky{position:static;top:auto}
  .mobile-total-bar{display:flex}
  .app-body{padding-bottom:76px} /* clears the fixed mobile total bar so it never covers the last row */
}
@media(max-width:600px){
  /* Phone-width fix: the fixed-px input grids (built for a wide desktop row) no
     longer fit a 375–430px screen and were overflowing/forcing horizontal scroll
     inside each line item. Reflow them into even columns that wrap instead. */
  .item-inputs{grid-template-columns:repeat(3,1fr)}
  .item-dim-row{grid-template-columns:repeat(2,1fr)}
  .custom-g1{grid-template-columns:1fr}
  .custom-g2{grid-template-columns:repeat(4,1fr)}
  .li-toolbar{flex-direction:column;align-items:stretch}
  .li-btns{flex-wrap:wrap}
  .li-btns .btn{flex:1 1 auto;justify-content:center;min-width:0!important}
  /* Larger touch target for the line-item checkbox without changing its visual size */
  .item-check{padding:8px 8px 8px 0;margin:-8px 0 -8px -8px}
}

/* ─── PANELS ────────────────────────────────────────── */
.panel{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);overflow:clip;transition:background .3s,border-color .3s}
.panel+.panel{margin-top:16px}
.panel-header{padding:13px 17px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;background:var(--bg-surface)}
.panel-title{font-family:var(--font-display);font-weight:500;font-size:14.5px;letter-spacing:-.01em}
.panel-body{padding:16px}

/* ─── FORM ──────────────────────────────────────────── */
.field-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.field-grid .span-2{grid-column:span 2}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--text-muted)}
.field input,.field textarea,.field select{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);padding:7px 9px;color:var(--text-primary);outline:none;transition:border-color .2s,box-shadow .2s;width:100%}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--border-focus);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 14%,transparent)}
.field textarea{resize:vertical;min-height:60px}

/* ─── BUTTONS ───────────────────────────────────────── */
.btn{border:none;border-radius:var(--radius-sm);padding:7px 12px;cursor:pointer;font-size:12.5px;font-weight:500;transition:all .2s;display:inline-flex;align-items:center;gap:5px;line-height:1}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent-hover);transform:translateY(-1px);box-shadow:var(--shadow-md)}
.btn-primary:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn-secondary{background:var(--bg-card);border:1px solid var(--border);color:var(--text-secondary)}
.btn-secondary:hover{background:var(--accent-light);color:var(--accent);border-color:var(--accent)}
.btn-ghost{background:transparent;border:1px dashed var(--border);color:var(--text-muted);font-size:11.5px;padding:5px 9px}
.btn-ghost:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-light)}
.btn-icon{background:none;border:none;cursor:pointer;color:var(--text-muted);padding:3px 5px;font-size:13px;transition:color .15s;border-radius:4px}
.btn-icon:hover{color:var(--danger)}

/* ─── LINE ITEMS TOOLBAR ────────────────────────────── */
.li-toolbar{background:var(--bg-toolbar);border-bottom:1px solid var(--border);padding:10px 17px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:7px;position:sticky;top:var(--header-h);z-index:22;transform:translateZ(0);-webkit-backface-visibility:hidden;will-change:transform}
.li-search-row{padding:8px 17px;background:var(--bg-toolbar);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;position:sticky;top:calc(var(--header-h) + var(--toolbar-h));z-index:21;transform:translateZ(0);-webkit-backface-visibility:hidden;will-change:transform}
.li-search-row input{flex:1;background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:7px 10px;font-size:12.5px;color:var(--text-primary);font-family:inherit;outline:none}
.li-search-row input:focus{border-color:var(--accent)}
@media(max-width:940px){.li-search-row{position:static}}
.btn-link{background:none;border:none;padding:0;font-size:10px;color:var(--accent);cursor:pointer;font-family:inherit;text-decoration:underline;line-height:1}
.btn-link:hover{opacity:.7}
.li-title{font-family:var(--font-display);font-weight:500;font-size:14.5px}
.li-hint{font-size:10.5px;color:var(--text-muted);margin-top:1px}
.li-btns{display:flex;gap:6px}

/* ─── CATEGORY SECTION (top level, bold) ────────────── */
.cat-section{border-top:2px solid var(--border)}
.cat-section:first-child{border-top:none}
.cat-sec-header{display:flex;align-items:center;gap:10px;padding:12px 17px;background:var(--bg-card);border-bottom:1px solid var(--border);cursor:pointer;user-select:none;position:sticky;top:calc(var(--header-h) + var(--toolbar-h) + var(--search-h));z-index:20;transform:translateZ(0);-webkit-backface-visibility:hidden;will-change:transform}
.cat-sec-title{font-family:var(--font-body);font-weight:700;font-size:13px;flex:1;color:var(--text-primary);letter-spacing:.03em;text-transform:uppercase}
.cat-sec-count{font-family:var(--font-mono);font-size:10px;color:var(--text-muted);background:var(--bg-toolbar);padding:2px 7px;border-radius:10px;border:1px solid var(--border)}
.cat-sec-chevron{font-size:10px;color:var(--text-muted);transition:transform .2s;flex-shrink:0}
.cat-section.collapsed>.cat-sec-header .cat-sec-chevron{transform:rotate(-90deg)}
.cat-section.collapsed>.cat-sec-body{display:none}

/* ─── AREA SUB-SECTION ───────────────────────────────── */
.area-sub{border-top:1px solid var(--border)}
.area-sub-header{display:flex;align-items:center;gap:8px;padding:7px 17px 7px 24px;background:var(--bg-toolbar);border-bottom:1px solid var(--border);cursor:pointer;user-select:none;position:sticky;top:calc(var(--header-h) + var(--toolbar-h) + var(--search-h) + var(--cat-h));z-index:19;transform:translateZ(0);-webkit-backface-visibility:hidden;will-change:transform}
.area-sub-name{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--text-secondary);flex:1}
.area-sub-count{font-family:var(--font-mono);font-size:9.5px;color:var(--text-muted)}
.area-sub-chevron{font-size:9px;color:var(--text-muted);transition:transform .2s}
.area-sub.collapsed>.area-sub-header .area-sub-chevron{transform:rotate(-90deg)}
.area-sub.collapsed>.area-sub-body{display:none}

/* ─── PICKER ─────────────────────────────────────────── */
.picker-row{padding:7px 17px 7px 24px;background:var(--bg);border-bottom:1px solid var(--border)}
.cat-section>.cat-sec-body>.picker-row{padding-left:17px}
.picker-trigger{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--accent);cursor:pointer;border:none;background:none;font-family:inherit;padding:0;transition:opacity .15s}
.picker-trigger:hover{opacity:.75}
.picker-panel{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px;margin-top:7px;box-shadow:var(--shadow-md);display:none}
.picker-item{display:flex;align-items:flex-start;gap:7px;padding:5px 5px;border-radius:3px;cursor:pointer;font-size:11.5px;line-height:1.35}
.picker-item:hover{background:var(--accent-light)}
.picker-item input[type=checkbox]{margin-top:2px;accent-color:var(--accent);width:13px;height:13px;flex-shrink:0;cursor:pointer}
.picker-actions{display:flex;gap:6px;margin-top:8px;padding-top:7px;border-top:1px solid var(--border)}
.picker-add-btn{flex:1;padding:6px;background:var(--accent);color:#fff;border:none;border-radius:4px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit}
.picker-add-btn:hover{background:var(--accent-hover)}
.picker-cancel-btn{padding:6px 10px;background:var(--bg-toolbar);color:var(--text-secondary);border:1px solid var(--border);border-radius:4px;font-size:11px;cursor:pointer;font-family:inherit}
.picker-empty{font-size:11px;color:var(--text-muted);font-style:italic;padding:3px 2px}

/* ─── ITEM ROW REMOVE BTN ───────────────────────────── */
.item-remove{position:absolute;top:7px;right:10px;background:none;border:none;cursor:pointer;color:var(--text-muted);font-size:12px;padding:2px 4px;border-radius:3px;transition:color .15s}
.item-remove:hover{color:var(--danger)}
.item-row{position:relative}

/* ─── ITEM ROW ──────────────────────────────────────── */
.item-row{display:grid;grid-template-columns:18px 1fr;gap:0 10px;padding:8px 17px;border-bottom:1px solid var(--border);align-items:start;transition:background .15s}
.item-row:last-child{border-bottom:none}
.item-row:hover{background:var(--accent-light)}
.item-row.unchecked{opacity:.5}
.item-row.unchecked:hover{opacity:1}
.item-check{padding-top:2px}
.item-check input[type=checkbox]{width:14px;height:14px;accent-color:var(--accent);cursor:pointer}
.item-body{display:flex;flex-direction:column;gap:5px}
.item-name{font-size:12px;font-weight:500;color:var(--text-primary);line-height:1.35}

/* ─── TINY INPUTS ───────────────────────────────────── */
/* Column order: Qty | Unit | Unit Cost | Total Cost | Amount | P/L */
.item-inputs{display:grid;grid-template-columns:52px 58px 80px 84px 82px 72px;gap:5px;align-items:end}
.item-dim-row{display:grid;grid-template-columns:82px 82px;gap:5px}
.tf{display:flex;flex-direction:column;gap:2px}
.tl{font-size:8.5px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--text-muted)}
.ti{background:var(--bg);border:1px solid var(--border);border-radius:4px;padding:4px 5px;color:var(--text-primary);outline:none;width:100%;font-size:11.5px;font-family:var(--font-mono);transition:border-color .15s}
.ti:focus{border-color:var(--border-focus)}
.ti[readonly]{background:var(--bg-toolbar);color:var(--text-secondary);cursor:default}
.ti.pl-pos{color:var(--pl-pos);font-weight:600}
.ti.pl-neg{color:var(--pl-neg);font-weight:600}

/* ─── COMMENTS ──────────────────────────────────────── */
.comment-block{display:flex;flex-direction:column;gap:5px;margin-top:2px}
.comment-opts{display:flex;flex-direction:column;gap:3px;padding:6px 8px;background:var(--bg);border:1px solid var(--border);border-radius:4px}
.comment-opt{display:flex;align-items:flex-start;gap:6px;font-size:11px;line-height:1.35;cursor:pointer;color:var(--text-primary)}
.comment-opt input[type=checkbox]{margin-top:2px;accent-color:var(--accent);width:13px;height:13px;flex-shrink:0;cursor:pointer}
.comment-custom-list{display:flex;flex-direction:column;gap:5px}
.comment-row{display:flex;gap:5px;align-items:center}
.comment-sel{background:var(--bg);border:1px solid var(--border);border-radius:4px;padding:4px 6px;color:var(--text-primary);outline:none;font-size:11px;flex:1;transition:border-color .15s}
.comment-sel:focus{border-color:var(--border-focus)}
.comment-txt{background:var(--bg);border:1px solid var(--border);border-radius:4px;padding:4px 6px;color:var(--text-primary);outline:none;font-size:11px;flex:1;transition:border-color .15s}
.comment-txt:focus{border-color:var(--border-focus)}
.comment-txt::placeholder{color:var(--text-muted);font-style:italic}
.comment-remove{flex-shrink:0}
.comment-add-btn{align-self:flex-start;background:none;border:1px dashed var(--border);color:var(--accent);font-size:10.5px;padding:4px 8px;border-radius:4px;cursor:pointer;font-family:inherit;transition:all .15s}
.comment-add-btn:hover{background:var(--accent-light);border-color:var(--accent)}
.comment-opt-wrap{display:flex;flex-direction:column;gap:3px}
.comment-row-wrap{display:flex;flex-direction:column;gap:3px}

/* ─── CARPENTRY ADDITIONAL-CHARGE TOGGLE ────────────── */
.charge-note{font-size:10px;font-weight:600;color:var(--accent);margin-top:2px}
.charge-toggle-wrap{display:flex;flex-direction:column;gap:5px;margin-left:19px;padding:3px 0}
.charge-toggle-head{display:flex;align-items:center;gap:6px}
.charge-switch{position:relative;display:inline-block;width:26px;height:15px;flex-shrink:0;cursor:pointer}
.charge-switch input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer}
.charge-switch .switch-track{position:absolute;inset:0;background:var(--border);border-radius:20px;transition:background .2s;pointer-events:none}
.charge-switch .switch-track::before{content:'';position:absolute;height:11px;width:11px;left:2px;top:2px;background:#fff;border-radius:50%;transition:transform .2s;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.charge-switch input:checked+.switch-track{background:var(--accent)}
.charge-switch input:checked+.switch-track::before{transform:translateX(11px)}
.charge-label{font-size:10px;color:var(--text-muted);white-space:nowrap}
.charge-fields{display:flex;gap:10px;padding-left:32px}
.charge-field{display:flex;flex-direction:column;gap:2px}
.charge-field-label{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text-muted)}
.charge-amt{width:78px;background:var(--bg);border:1px solid var(--border);border-radius:4px;padding:3px 6px;font-size:10.5px;color:var(--text-primary);font-family:var(--font-mono);outline:none}
.charge-amt:focus{border-color:var(--border-focus)}
.charge-amt[readonly]{background:var(--bg-toolbar);color:var(--text-secondary);cursor:default}
.charge-pl.pl-pos{color:var(--pl-pos);font-weight:600}
.charge-pl.pl-neg{color:var(--pl-neg);font-weight:600}

/* ─── CUSTOM ROW ────────────────────────────────────── */
.custom-row{background:color-mix(in srgb,var(--accent-light) 50%,var(--bg-card));border-bottom:1px solid var(--border);padding:10px 17px}
.custom-row:last-child{border-bottom:none}
.custom-tag{font-family:var(--font-mono);font-size:9px;font-weight:500;background:var(--warning);color:#fff;border-radius:3px;padding:2px 5px;text-transform:uppercase}
.custom-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px}
.custom-g1{display:grid;grid-template-columns:1fr 100px 64px;gap:5px;margin-bottom:5px}
/* Qty | Unit | Unit Cost | Total Cost | Amount | P/L | W | H */
.custom-g2{display:grid;grid-template-columns:52px 58px 80px 84px 82px 72px 78px 78px;gap:5px;margin-bottom:5px}

/* ─── ADD CUSTOM BAR ────────────────────────────────── */
.add-custom-bar{padding:11px 17px;border-top:1px solid var(--border)}

/* ─── RIGHT SIDEBAR ─────────────────────────────────── */
.right-sticky{position:sticky;top:74px}
.mobile-total-bar{display:none;position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--bg-card);border-top:1px solid var(--border);box-shadow:0 -4px 16px rgba(0,0,0,.12);padding:10px 14px;padding-bottom:calc(10px + env(safe-area-inset-bottom));align-items:center;gap:12px;}
.mtb-info{display:flex;flex-direction:column;line-height:1.2}
.mtb-count{font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em}
.mtb-label{font-size:10px;color:var(--text-muted)}
.mtb-amount{font-family:'DM Mono',monospace;font-weight:700;font-size:16px;color:var(--text-primary);flex:1;text-align:right}
#mtbPreviewBtn{padding:8px 16px;font-size:12.5px;white-space:nowrap}
.sum-row{display:flex;justify-content:space-between;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--border)}
.sum-row:last-of-type{border-bottom:none}
.sum-label{font-size:11px;font-weight:500;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.06em}
.sum-val{font-family:var(--font-mono);font-size:14px;font-weight:500;color:var(--text-primary)}
.sum-val.big{font-size:20px;font-family:var(--font-display);letter-spacing:-.02em}
.bar-wrap{padding:11px 0 4px}
.bar-labels{display:flex;justify-content:space-between;font-size:10.5px;color:var(--text-muted);margin-bottom:5px}
.bar-track{height:5px;background:var(--border);border-radius:3px;overflow:hidden}
.bar-fill{height:100%;background:var(--accent);border-radius:3px;transition:width .4s ease;min-width:2px}
.side-actions{padding:0 13px 13px;display:flex;flex-direction:column;gap:7px}
.btn-full{width:100%;justify-content:center;padding:10px;font-size:13px;border-radius:var(--radius-md)}
.btn-full.big{padding:12px;font-size:14px;font-weight:600}

/* ─── LOAD QUOTE ─────────────────────────────────────── */
.load-quote-row{display:flex;gap:6px;padding:11px 13px 0}
.load-quote-row input{flex:1;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);padding:6px 9px;color:var(--text-primary);outline:none;font-size:12px}
.load-quote-row input:focus{border-color:var(--border-focus)}

/* ─── STATUS ────────────────────────────────────────── */
.status-row{display:flex;align-items:center;gap:6px;padding:7px 10px;border-radius:var(--radius-sm);font-size:11.5px;font-weight:500;transition:all .3s}
.s-idle{background:var(--bg-toolbar);color:var(--text-muted)}
.s-loading{background:color-mix(in srgb,var(--warning) 12%,transparent);color:var(--warning);border:1px solid color-mix(in srgb,var(--warning) 30%,transparent)}

/* ─── PREVIEW MODAL ─────────────────────────────────── */
.preview-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.62);z-index:500;align-items:flex-start;justify-content:center;padding:28px 14px;overflow-y:auto}

.preview-head{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--border);background:var(--bg-surface);border-radius:var(--radius-lg) var(--radius-lg) 0 0;flex-shrink:0}
.preview-title{font-family:var(--font-display);font-weight:500;font-size:16px}
.preview-tabs{display:flex;gap:0;border:1px solid var(--border);border-radius:var(--radius-sm);overflow:hidden}
.ptab{padding:6px 16px;font-size:12px;font-weight:500;cursor:pointer;background:var(--bg-toolbar);color:var(--text-secondary);border:none;transition:all .2s}
.ptab.active{background:var(--accent);color:#fff}
.preview-close{background:none;border:none;cursor:pointer;font-size:17px;color:var(--text-muted);padding:4px 6px;border-radius:4px;transition:color .15s}
.preview-close:hover{color:var(--danger)}
.preview-body{padding:20px;max-height:68vh;overflow-y:auto;flex:1}
.preview-foot{display:flex;gap:8px;justify-content:flex-end;padding:12px 20px;border-top:1px solid var(--border);background:var(--bg-surface);border-radius:0 0 var(--radius-lg) var(--radius-lg);flex-shrink:0;flex-wrap:wrap}

/* ===== UNIFIED SIGN-OFF BLOCK (grid-locked rows = guaranteed alignment) ===== */
.doc-sign-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  grid-template-rows:auto auto auto;
  column-gap:36px;
  margin-top:28px;
  padding-top:22px;
  border-top:1px solid #E8E2D9;
}

.doc-sign-label{

  color:#B8945A;margin-bottom:8px;
}

  grid-row:2;
  height:48px;

}

.doc-sign-date{
  grid-row:4;
  font-size:10px;color:#6B5E52;margin-top:8px;padding-top:6px;

}
.doc-sign-date b{color:#1a1a1a;font-weight:600}

.doc-sign-col{display:contents} /* lets children participate directly in the grid rows */
@media(max-width:600px){
  .doc-sign-grid{grid-template-columns:1fr;row-gap:22px}
  .doc-sign-grid .doc-sign-col{display:block}
}

.doc-tc-ref{font-family:monospace;font-size:10.5px;color:#9E8E82}

.doc-tc-amt{font-family:monospace;font-weight:600;color:#7B1818;white-space:nowrap}
.doc-tc-sig-note{margin-top:22px;font-size:11px;line-height:1.6}

/* ─── LOADER ────────────────────────────────────────── */
.loader-wrap{padding:36px 18px;text-align:center;color:var(--text-muted);font-size:12.5px}

@keyframes spin{to{transform:rotate(360deg)}}
::-webkit-scrollbar{width:5px;height:5px}

/* ══════════════════════════════════════════════════════
   CSV PARSER
══════════════════════════════════════════════════════ */
function parseCSV(text){
  const rows=[];let row=[],field='',inQ=false;
  for(let i=0;i<text.length;i++){
    const c=text[i],nx=text[i+1];
    if(inQ){if(c==='"'&&nx==='"'){field+='"';i++;}else if(c==='"'){inQ=false;}else{field+=c;}}
    else{if(c==='"'){inQ=true;}else if(c===','){row.push(field.trim());field='';}
    else if(c==='\n'){row.push(field.trim());rows.push(row);row=[];field='';}else if(c!=='\r'){field+=c;}}
  }
  if(field||row.length){row.push(field.trim());rows.push(row);}
  return rows;
}
function csvToObjects(text){
  const rows=parseCSV(text);if(rows.length<2)return[];
  const headers=rows[0].map(h=>h.trim());
  return rows.slice(1).filter(r=>r.some(c=>c)).map(r=>{const o={};headers.forEach((h,i)=>{o[h]=(r[i]||'').trim();});return o;});
}

/* ══════════════════════════════════════════════════════
   MAP CSV ROW → catalog item
══════════════════════════════════════════════════════ */
function mapCSVRow(row){
  const name=(row['Item Name']||'').trim();if(!name)return[];
  const cat=(row['Work Categories']||row['Linked Work Category']||'').trim();
  if(name===cat)return[];
  const areasRaw=(row['Work Areas']||'').trim();
  const areas=areasRaw?areasRaw.split(',').map(a=>a.trim()).filter(Boolean):['General'];
  const commentsRaw=row['Comments']||'';
  const commentLines=commentsRaw.split(/\r?\n/).map(l=>l.trim().replace(/^'+/,'').replace(/^,+/,'').trim()).filter(l=>l.startsWith('-')||l.startsWith("'"));
  const hasDim=!!(row['Default Measurements']&&/\d/.test(row['Default Measurements']));
  const base={item_name:name,category_id:cat||'GENERAL',comment_options:commentLines,default_measurements:(row['Default Measurements']||'').trim(),default_billing_amount:money(row['Default Billing Amount']),default_internal_cost:money(row['Default Internal Cost']),has_dimensions:hasDim,is_default:(row['is_default']||'').trim().toUpperCase()==='TRUE'};
  return areas.map(area=>({...base,area_id:area}));
}

/* ══════════════════════════════════════════════════════
   LOAD CATALOG
══════════════════════════════════════════════════════ */
function setCatalogBadge(text, isError){
  let el=document.getElementById('catalogBadge');
  if(!el){el=document.createElement('span');el.id='catalogBadge';el.style.cssText='font-size:10px;padding:2px 7px;border-radius:3px;font-weight:600;margin-left:10px;vertical-align:middle';document.querySelector('.li-title').appendChild(el);}
  el.textContent=text;el.style.background=isError?'var(--danger)':'var(--success)';el.style.color='#fff';
}
async function loadCatalog(){
  if(CONFIG.catalogUrl && !CONFIG.catalogUrl.startsWith('PASTE_')){
    try{
      setCatalogBadge('Loading…',false);
      const res=await fetch(CONFIG.catalogUrl);
      if(!res.ok) throw new Error('HTTP '+res.status);
      const text=await res.text();
      if(text.trim().startsWith('<!')) throw new Error('Got HTML instead of CSV — sheet not public');
      const objs=csvToObjects(text);
      catalog=objs.flatMap(r=>{try{return mapCSVRow(r);}catch(e){return[];}});
      if(!catalog.length)throw new Error('CSV parsed but 0 items mapped');
      setCatalogBadge('✓ Live: '+catalog.length+' items',false);
      console.log('Catalog loaded from Sheet:',catalog.length,'items');
    }catch(e){
      console.warn('Falling back to sample catalog:',e.message);
      setCatalogBadge('⚠ Sample ('+e.message+')',true);
      catalog=SAMPLE_CATALOG;
    }
  }else{
    setCatalogBadge('⚠ Sample (no URL)',true);
    catalog=SAMPLE_CATALOG;
  }
  initLineItems();
  pendingItems.clear();
  updatePendingButton();
  renderLineItems();
}

/* ══════════════════════════════════════════════════════
   SORT ORDERS
══════════════════════════════════════════════════════ */
const CAT_ORDER=['PROFESSIONAL SERVICES','RENOVATION PERMIT/PE ENDORSEMENT','DEMOLITION WORKS','MASONRY WORKS','MASONARY WORKS','SANITARY & PLUMBING WORKS','DOOR / GLASS / WINDOWS WORKS','CARPENTRY WORKS','TABLE TOP / PARTITION & CEILING','ELECTRICAL WORKS','AIRCON WORKS','MISCELLANEOUS'];
const AREA_ORDER=['General','Whole Unit','Kitchen','Master Bathroom','Common Bathroom','Master Bedroom','Bedroom 2','Bedroom 3','Living Room','Dining Room','Yard','Yard / Service Area'];
function catSort(a,b){const ai=CAT_ORDER.findIndex(x=>x.toUpperCase()===a.toUpperCase());const bi=CAT_ORDER.findIndex(x=>x.toUpperCase()===b.toUpperCase());return(ai<0?99:ai)-(bi<0?99:bi);}
function areaSort(a,b){const ai=AREA_ORDER.indexOf(a);const bi=AREA_ORDER.indexOf(b);return(ai<0?99:ai)-(bi<0?99:bi);}

/* ══════════════════════════════════════════════════════
   LINE ITEM HELPERS
══════════════════════════════════════════════════════ */
function slugify(s){return s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'').substr(0,60)}
function detectUnit(s){if(!s)return'lot';if(/sqft/i.test(s))return'sqft';if(/m2/i.test(s))return'm2';if(/\bft\b/i.test(s))return'ft';return'lot'}
/* ─── UNIT DROPDOWN ─────────────────────────────────── */
const UNIT_OPTIONS=['Lot','Nos','L/S','Sqft','Ft'];
function buildUnitSelect(li){
  const cur=li.unit||'Lot';
  const matched=UNIT_OPTIONS.find(u=>u.toLowerCase()===String(cur).toLowerCase());
  let opts=UNIT_OPTIONS.map(u=>`<option value="${u}"${matched===u?' selected':''}>${u}</option>`).join('');
  if(!matched&&cur)opts+=`<option value="${esc(cur)}" selected>${esc(cur)}</option>`;
  return`<select class="ti" data-field="unit">${opts}</select>`;
}
function detectQty(s){if(!s)return 1;const m=s.match(/^(\d+(?:\.\d+)?)/);return m?parseFloat(m[1]):1}
function extractDim(s,axis){if(!s)return null;const rx=axis==='L'?/L[:\s]*(\d+)/i:/H[:\s]*(\d+)/i;const m=s.match(rx);return m?parseInt(m[1]):null}

function makeLI(c,isDefault){
  const qty=detectQty(c.default_measurements),unit=detectUnit(c.default_measurements);
  const cost=c.default_internal_cost,sell=c.default_billing_amount;
  const markup=(cost&&sell)?Math.round(((sell-cost)/cost)*100):30;
  return{id:uid(),item_id:slugify(c.item_name),is_custom:false,included:true,
    category_id:c.category_id,area_id:c.area_id||'General',item_name:c.item_name,
    unit,qty,base_cost:cost,markup_pct:markup,amount:sell||0,
    has_dimensions:!!c.has_dimensions,width_mm:extractDim(c.default_measurements,'L'),height_mm:extractDim(c.default_measurements,'H'),
    comment_options:c.comment_options||[],remarks:'',remarks_is_custom:false,
    comment_selected:[],remarks_custom_list:[],
    included_by_default:!!(isDefault||c.is_default)};
}

function getAvailable(catId,areaId){
  const added=new Set(lineItems.filter(li=>!li.is_custom&&li.category_id===catId&&li.area_id===areaId).map(li=>li.item_name));
  return catalog.filter(c=>c.category_id===catId&&(c.area_id||'General')===areaId&&!added.has(c.item_name));
}

/* ══════════════════════════════════════════════════════
   INIT — only pre-load defaults
══════════════════════════════════════════════════════ */
function initLineItems(){
  lineItems=catalog.filter(c=>c.is_default).map(c=>makeLI(c,true));
}

function insertDefaults(){
  const added=new Set(lineItems.filter(li=>!li.is_custom).map(li=>li.item_name));
  catalog.filter(c=>c.is_default&&!added.has(c.item_name)).forEach(c=>lineItems.push(makeLI(c,true)));
  renderLineItems();
}
function removeAllItems(){
  if(!lineItems.length)return;
  if(!confirm(`Remove all ${lineItems.length} line item(s)? This can't be undone.`))return;
  lineItems=[];
  renderLineItems();
  updateSummary();
}

function addFromPicker(items){
  items.forEach(c=>{
    const li=makeLI(c,false);
    // Find the last existing item in the same category+area to insert after
    let insertIdx=-1;
    for(let i=lineItems.length-1;i>=0;i--){
      if(lineItems[i].category_id===li.category_id&&lineItems[i].area_id===li.area_id){insertIdx=i;break;}
    }
    if(insertIdx>=0){lineItems.splice(insertIdx+1,0,li);}
    else{lineItems.push(li);}
  });
  renderLineItems();
  updateSummary();
}

/* ══════════════════════════════════════════════════════
   CALCULATIONS
══════════════════════════════════════════════════════ */
function calcPL(li){return lineAmountTotal(li)-lineCostTotal(li);}
function updateSummary(){
  const active=lineItems.filter(li=>li.included);
  let totalAmt=0,totalCost=0;
  active.forEach(li=>{totalAmt+=lineAmountTotal(li);totalCost+=lineCostTotal(li);});
  const profit=totalAmt-totalCost,margin=totalAmt>0?(profit/totalAmt)*100:0;
  document.getElementById('sumAmount').textContent=fmt(totalAmt);
  document.getElementById('sumCost').textContent=fmt(totalCost);
  document.getElementById('sumProfit').textContent=fmt(profit);
  document.getElementById('sumProfit').style.color=profit>=0?'var(--pl-pos)':'var(--pl-neg)';
  document.getElementById('sumMarginPct').textContent=pct(margin);
  document.getElementById('marginBar').style.width=Math.max(0,Math.min(100,margin))+'%';
  const mtb=document.getElementById('mobileTotalBar');
  if(mtb){
    document.getElementById('mtbAmount').textContent=fmt(totalAmt);
    document.getElementById('mtbCount').textContent=active.length+' item'+(active.length===1?'':'s');
  }
}

/* ══════════════════════════════════════════════════════
   STICKY OFFSET SYNC
   The stacked sticky bars (page header → toolbar → category → area) position
   themselves using --header-h/--toolbar-h/--cat-h, which used to be hardcoded
   guesses. Any mismatch between a guess and the real rendered height (long
   category titles wrapping, webfont metrics, mobile font rendering, zoom level)
   left a visible gap — or an overlap — between two stuck bars. This measures
   the *actual* rendered heights and writes them back as CSS vars, per category
   section, so the offsets are always correct on whatever device/viewport it's
   opened on.
══════════════════════════════════════════════════════ */
function syncStickyOffsets(){
  const header=document.querySelector('.header');
  const toolbar=document.querySelector('.li-toolbar');
  const search=document.querySelector('.li-search-row');
  if(header)document.documentElement.style.setProperty('--header-h',header.offsetHeight+'px');
  if(toolbar && getComputedStyle(toolbar).position==='sticky')document.documentElement.style.setProperty('--toolbar-h',toolbar.offsetHeight+'px');
  // Search row is a sticky bar too (see .li-search-row) — folded into the same
  // measured-not-guessed offset chain as the rest of the sticky stack, for the
  // same reason --toolbar-h/--cat-h are measured: a hardcoded guess here would
  // reopen the exact category/area header gap bug this mechanism exists to fix.
  document.documentElement.style.setProperty('--search-h',(search && getComputedStyle(search).position==='sticky')?search.offsetHeight+'px':'0px');
  document.querySelectorAll('.cat-section').forEach(sec=>{
    const hdr=sec.querySelector(':scope > .cat-sec-header');
    if(hdr)sec.style.setProperty('--cat-h',hdr.offsetHeight+'px');
  });
}
let _stickySyncRaf=null;
function scheduleStickySync(){
  if(_stickySyncRaf)cancelAnimationFrame(_stickySyncRaf);
  _stickySyncRaf=requestAnimationFrame(()=>{_stickySyncRaf=null;syncStickyOffsets();});
}
window.addEventListener('resize',scheduleStickySync);
window.addEventListener('orientationchange',scheduleStickySync);
if(document.fonts && document.fonts.ready)document.fonts.ready.then(scheduleStickySync);

/* ══════════════════════════════════════════════════════
   RENDER ALL — Category → Area → Items
══════════════════════════════════════════════════════ */
function renderLineItems(){
  const container=document.getElementById('lineItemsContainer');
  container.innerHTML='';

  // Build category → areas from full CATALOG (shows all possible areas even if empty)
  const catAreas={};
  catalog.forEach(c=>{
    const cat=c.category_id,area=c.area_id||'General';
    if(!catAreas[cat])catAreas[cat]=new Set();
    catAreas[cat].add(area);
  });

  const cats=Object.keys(catAreas).sort(catSort);
  if(!cats.length){container.innerHTML='<div class="loader-wrap">No catalog loaded.</div>';return;}

  cats.forEach(catId=>{
    const areas=[...catAreas[catId]].sort(areaSort);
    const catLIs=lineItems.filter(li=>!li.is_custom&&li.category_id===catId&&li.included);
    const singleGeneral=areas.length===1&&areas[0]==='General';

    const sec=document.createElement('div');sec.className='cat-section';sec.dataset.catId=catId;

    // ── Category header ──────────────────────────────
    const hdr=document.createElement('div');hdr.className='cat-sec-header';
    const countTxt=catLIs.length?`${catLIs.length} item${catLIs.length!==1?'s':''}`:'-';
    hdr.innerHTML=`<span class="cat-sec-title">${esc(catId)}</span><span class="cat-sec-count">${countTxt}</span><span class="cat-sec-chevron">▾</span>`;
    hdr.addEventListener('click',()=>{catCollapsed.set(catId,sec.classList.toggle('collapsed'));});
    // Collapse categories with no items selected and no defaults — but only decide this
    // the first time we see a category; afterwards respect whatever the user last set.
    if(!catCollapsed.has(catId))catCollapsed.set(catId,!catLIs.length);
    if(catCollapsed.get(catId))sec.classList.add('collapsed');

    const body=document.createElement('div');body.className='cat-sec-body';

    if(singleGeneral){
      // In load view: only render included items; otherwise render all
      const rowFilter=li=>!li.is_custom&&li.category_id===catId&&(!_loadedView||li.included);
      lineItems.filter(rowFilter).forEach(li=>body.appendChild(renderCatalogRow(li)));
      body.appendChild(buildPickerRow(catId,'General'));
    }else{
      areas.forEach(areaId=>{
        body.appendChild(buildAreaSub(catId,areaId));
      });
    }

    sec.appendChild(hdr);sec.appendChild(body);container.appendChild(sec);
  });

  // ── Custom items ─────────────────────────────────
  const customs=lineItems.filter(li=>li.is_custom);
  if(customs.length){
    const customKey='__custom__';
    const sec=document.createElement('div');sec.className='cat-section';sec.dataset.catId=customKey;
    const hdr=document.createElement('div');hdr.className='cat-sec-header';
    hdr.innerHTML=`<span class="cat-sec-title" style="color:var(--warning)">Custom Items</span><span class="cat-sec-count">${customs.length}</span><span class="cat-sec-chevron">▾</span>`;
    hdr.addEventListener('click',()=>{catCollapsed.set(customKey,sec.classList.toggle('collapsed'));});
    if(!catCollapsed.has(customKey))catCollapsed.set(customKey,false);
    if(catCollapsed.get(customKey))sec.classList.add('collapsed');
    const body=document.createElement('div');body.className='cat-sec-body';
    customs.forEach(li=>body.appendChild(renderCustomRow(li)));
    sec.appendChild(hdr);sec.appendChild(body);container.appendChild(sec);
  }

  // ── Add custom bar ────────────────────────────────
  const bar=document.createElement('div');bar.className='add-custom-bar';
  const btn=document.createElement('button');btn.className='btn btn-ghost';btn.style='width:100%;justify-content:center';
  btn.textContent='＋ Add custom item';btn.addEventListener('click',addCustomItem);
  bar.appendChild(btn);container.appendChild(bar);
  updateSummary();
  scheduleStickySync();
  applyCatalogSearch(catalogSearchQuery);
}

/* ══════════════════════════════════════════════════════
   CATALOG SEARCH
   Filters already-rendered item-rows/custom-rows by item_name,
   hiding empty area/category sections. Doesn't reach into a
   picker's un-expanded "Add items" list (that's a bigger,
   separate feature) — this is for quickly finding items already
   on the quote, or jumping to the right category/area fast.
══════════════════════════════════════════════════════ */
let catalogSearchQuery='';
function applyCatalogSearch(q){
  q=(q||'').trim().toLowerCase();
  document.querySelectorAll('.area-sub').forEach(areaEl=>{
    let anyVisible=!q;
    areaEl.querySelectorAll('.item-row,.custom-row').forEach(rowEl=>{
      const li=lineItems.find(x=>x.id===rowEl.dataset.id);
      const hit=!q||(li&&(li.item_name||'').toLowerCase().includes(q));
      rowEl.style.display=hit?'':'none';
      if(hit)anyVisible=true;
    });
    areaEl.style.display=anyVisible?'':'none';
  });
  document.querySelectorAll('.cat-section').forEach(catEl=>{
    const areas=catEl.querySelectorAll('.area-sub');
    const directRows=catEl.querySelectorAll(':scope > .cat-sec-body > .item-row, :scope > .cat-sec-body > .custom-row');
    let anyVisible=!q;
    if(areas.length){
      anyVisible=!q||Array.from(areas).some(a=>a.style.display!=='none');
    }else if(directRows.length){
      anyVisible=false;
      directRows.forEach(rowEl=>{
        const li=lineItems.find(x=>x.id===rowEl.dataset.id);
        const hit=!q||(li&&(li.item_name||'').toLowerCase().includes(q));
        rowEl.style.display=hit?'':'none';
        if(hit)anyVisible=true;
      });
    }
    catEl.style.display=anyVisible?'':'none';
  });
}
document.getElementById('catalogSearch').addEventListener('input',e=>{
  catalogSearchQuery=e.target.value;
  document.getElementById('btnClearSearch').style.display=catalogSearchQuery?'':'none';
  applyCatalogSearch(catalogSearchQuery);
});
document.getElementById('btnClearSearch').addEventListener('click',()=>{
  catalogSearchQuery='';
  document.getElementById('catalogSearch').value='';
  document.getElementById('btnClearSearch').style.display='none';
  applyCatalogSearch('');
});

function buildAreaSub(catId,areaId){
  const sub=document.createElement('div');sub.className='area-sub';sub.dataset.catId=catId;sub.dataset.areaId=areaId;
  const areaKey=catId+'::'+areaId;
  const areaLIs=lineItems.filter(li=>!li.is_custom&&li.category_id===catId&&li.area_id===areaId);
  const includedN=areaLIs.filter(li=>li.included).length;

  const hdr=document.createElement('div');hdr.className='area-sub-header';
  hdr.innerHTML=`<span class="area-sub-name">${esc(areaId)}</span><span class="area-sub-count">${includedN?includedN+' selected':''}</span><span class="area-sub-chevron">▾</span>`;
  hdr.addEventListener('click',()=>{areaCollapsed.set(areaKey,sub.classList.toggle('collapsed'));});
  // Collapse areas with nothing selected — but only decide this the first time we see
  // an area; afterwards respect whatever the user last set.
  if(!areaCollapsed.has(areaKey))areaCollapsed.set(areaKey,!includedN);
  if(areaCollapsed.get(areaKey))sub.classList.add('collapsed');

  const body=document.createElement('div');body.className='area-sub-body';
  const visibleLIs=_loadedView?areaLIs.filter(li=>li.included):areaLIs;
  visibleLIs.forEach(li=>body.appendChild(renderCatalogRow(li)));
  body.appendChild(buildPickerRow(catId,areaId));

  sub.appendChild(hdr);sub.appendChild(body);
  return sub;
}

function buildPickerRow(catId,areaId){
  const row=document.createElement('div');row.className='picker-row';
  const avail=getAvailable(catId,areaId);
  if(!avail.length){
    if(lineItems.filter(li=>!li.is_custom&&li.category_id===catId&&li.area_id===areaId).length)
      row.innerHTML=`<span class="picker-empty">All catalog items added</span>`;
    return row;
  }

  function pendingCountHere(){return avail.filter(c=>pendingItems.has(getPendingKey(c))).length;}
  function triggerLabel(){
    const n=pendingCountHere();
    return `＋ Add items <span style="font-size:9.5px;opacity:.7">(${getAvailable(catId,areaId).length} available${n?` · <b>${n} selected</b>`:''})</span>`;
  }

  const trigger=document.createElement('button');trigger.className='picker-trigger';
  trigger.innerHTML=triggerLabel();

  const panel=document.createElement('div');panel.className='picker-panel';

  function buildPanel(){
    panel.innerHTML='';
    const fresh=getAvailable(catId,areaId);
    if(!fresh.length){panel.innerHTML='<div class="picker-empty">All items already added</div>';return;}

    // Select All row
    const saRow=document.createElement('label');
    saRow.className='picker-item';saRow.style.cssText='font-weight:600;border-bottom:1px solid var(--border);padding-bottom:6px;margin-bottom:2px';
    const saCb=document.createElement('input');saCb.type='checkbox';
    const saSpan=document.createElement('span');saSpan.textContent='Select all';
    saRow.appendChild(saCb);saRow.appendChild(saSpan);panel.appendChild(saRow);

    const itemCbs=[];
    fresh.forEach(c=>{
      const key=getPendingKey(c);
      const lbl=document.createElement('label');lbl.className='picker-item';
      const cb=document.createElement('input');cb.type='checkbox';cb.checked=pendingItems.has(key);
      cb.addEventListener('change',()=>{
        if(cb.checked)pendingItems.set(key,c);else pendingItems.delete(key);
        saCb.checked=itemCbs.every(x=>x.checked);
        saCb.indeterminate=!saCb.checked&&itemCbs.some(x=>x.checked);
        trigger.innerHTML=triggerLabel();
        updatePendingButton();
      });
      const span=document.createElement('span');span.textContent=c.item_name;
      lbl.appendChild(cb);lbl.appendChild(span);panel.appendChild(lbl);
      itemCbs.push(cb);
    });

    // Wire select-all
    saCb.checked=itemCbs.every(x=>x.checked);
    saCb.indeterminate=!saCb.checked&&itemCbs.some(x=>x.checked);
    saCb.addEventListener('change',()=>{
      itemCbs.forEach((cb,i)=>{
        cb.checked=saCb.checked;
        const key=getPendingKey(fresh[i]);
        if(saCb.checked)pendingItems.set(key,fresh[i]);else pendingItems.delete(key);
      });
      trigger.innerHTML=triggerLabel();
      updatePendingButton();
    });

    // Footer: Add Selected (this area) + Close
    const closeRow=document.createElement('div');closeRow.style.cssText='padding-top:7px;margin-top:4px;border-top:1px solid var(--border);display:flex;gap:6px;justify-content:flex-end';

    const addBtn=document.createElement('button');addBtn.className='btn btn-primary';addBtn.style.cssText='font-size:11px;padding:4px 12px';
    function refreshAddBtn(){
      const n=pendingCountHere();
      addBtn.textContent=n?`Add ${n} selected`:'Add Selected';
      addBtn.disabled=!n;
    }
    refreshAddBtn();
    // Re-check count when checkboxes change — patch existing listeners
    const origUpdatePending=updatePendingButton;
    itemCbs.forEach(cb=>cb.addEventListener('change',refreshAddBtn));
    saCb.addEventListener('change',refreshAddBtn);
    addBtn.addEventListener('click',()=>{
      const toAdd=avail.filter(c=>pendingItems.has(getPendingKey(c)));
      if(!toAdd.length)return;
      toAdd.forEach(c=>pendingItems.delete(getPendingKey(c)));
      addFromPicker(toAdd);
      updatePendingButton();
      panel.style.display='none';
      trigger.innerHTML=triggerLabel();
    });

    const closeBtn=document.createElement('button');closeBtn.className='picker-cancel-btn';closeBtn.textContent='Close';
    closeBtn.addEventListener('click',()=>{panel.style.display='none';trigger.innerHTML=triggerLabel();});
    closeRow.appendChild(addBtn);closeRow.appendChild(closeBtn);panel.appendChild(closeRow);
  }

  trigger.addEventListener('click',()=>{
    if(panel.style.display==='none'||!panel.style.display){buildPanel();panel.style.display='block';}
    else{panel.style.display='none';trigger.innerHTML=triggerLabel();}
  });

  row.appendChild(trigger);row.appendChild(panel);
  return row;
}

/* ══════════════════════════════════════════════════════
   RENDER CATALOG ROW
   Column order: Qty | Unit | Unit Cost | Amount | P/L
══════════════════════════════════════════════════════ */
/* ─── CARPENTRY ADDITIONAL-CHARGE TOGGLES ───────────────
   Any line item under CARPENTRY WORKS gets a per-comment
   toggle. Switching it on reveals two fields — Unit Cost and
   Amount ($) — and whatever is typed there is added onto that
   item's base Unit Cost / Amount. Charge state is tracked in
   li.charge_state, keyed by the comment text (catalog options)
   or 'custom-<i>' (free-typed comments), so it survives
   re-renders.
══════════════════════════════════════════════════════ */
function isCarpentry(li){return String(li&&li.category_id||'').trim().toUpperCase()==='CARPENTRY WORKS';}
function getChargeCostTotal(li){
  if(!isCarpentry(li))return 0;
  const state=li.charge_state||{};
  return Object.values(state).reduce((sum,s)=>sum+((s&&s.enabled)?(Number(s.costAmt)||0):0),0);
}
function getChargeAmtTotal(li){
  if(!isCarpentry(li))return 0;
  const state=li.charge_state||{};
  return Object.values(state).reduce((sum,s)=>sum+((s&&s.enabled)?(Number(s.amtAmt)||0):0),0);
}
/* Additional-charge amounts are flat (entered once) and must NOT be
   multiplied by the item's quantity. li.base_cost / li.amount store the
   charge baked directly into the per-unit figure (see setChargeEnabled/
   setChargeCost/setChargeAmt), so to get a correct line total we strip the
   flat charge back out, multiply the remaining per-unit figure by qty,
   then add the flat charge back on once. */
function lineAmountTotal(li){
  const q=Number(li.qty)||1,chargeAmt=getChargeAmtTotal(li);
  return ((Number(li.amount)||0)-chargeAmt)*q+chargeAmt;
}
function lineCostTotal(li){
  const q=Number(li.qty)||1,chargeCost=getChargeCostTotal(li);
  return ((Number(li.base_cost)||0)-chargeCost)*q+chargeCost;
}
function getActiveCharges(li){
  if(!isCarpentry(li))return[];
  const state=li.charge_state||{};
  const list=[];
  Object.keys(state).forEach(key=>{
    const st=state[key];
    if(!st||!st.enabled)return;
    let label=key;
    if(key.startsWith('custom-')){
      const idx=parseInt(key.slice(7),10);
      label=(li.remarks_custom_list&&li.remarks_custom_list[idx])||key;
    }
    const cost=Number(st.costAmt)||0,amt=Number(st.amtAmt)||0;
    if(cost>0||amt>0)list.push({label,cost:+cost.toFixed(2),amt:+amt.toFixed(2)});
  });
  return list;
}
function chargeNoteText(li){
  const c=getChargeCostTotal(li),a=getChargeAmtTotal(li);
  const pl=a-c;
  const parts=[];
  if(c>0)parts.push(`+$${c.toFixed(2)} cost`);
  if(a>0)parts.push(`+$${a.toFixed(2)} amount`);
  if(c>0||a>0)parts.push(`${pl>=0?'+':'-'}$${Math.abs(pl).toFixed(2)} P/L`);
  return parts.length?`Includes ${parts.join(', ')} additional charge(s) — already reflected in Unit Cost, Amount &amp; P/L below`:'';
}
function chargeNoteHTML(li){
  const text=chargeNoteText(li);
  return `<div class="charge-note" data-role="charge-note" style="display:${text?'block':'none'}">${text}</div>`;
}
function refreshChargeNote(row,li){
  const el=row.querySelector('[data-role="charge-note"]');
  if(!el)return;
  const text=chargeNoteText(li);
  el.textContent=text;
  el.style.display=text?'block':'none';
}
function syncAmountField(row,li){
  const el=row.querySelector('[data-field="amount"]');
  if(el)el.value=Number(li.amount).toFixed(2);
}
function syncCostField(row,li){
  const el=row.querySelector('[data-field="base_cost"]');
  if(el)el.value=Number(li.base_cost).toFixed(2);
}
function setChargeEnabled(li,key,enabled){
  li.charge_state=li.charge_state||{};
  const st=li.charge_state[key]||{enabled:false,costAmt:0,amtAmt:0};
  const c=Number(st.costAmt)||0,a=Number(st.amtAmt)||0;
  if(enabled&&!st.enabled){li.base_cost=(Number(li.base_cost)||0)+c;li.amount=(Number(li.amount)||0)+a;}
  else if(!enabled&&st.enabled){li.base_cost=(Number(li.base_cost)||0)-c;li.amount=(Number(li.amount)||0)-a;}
  st.enabled=enabled;
  li.charge_state[key]=st;
}
function setChargeCost(li,key,newCost){
  li.charge_state=li.charge_state||{};
  const st=li.charge_state[key]||{enabled:false,costAmt:0,amtAmt:0};
  const oldC=Number(st.costAmt)||0,nC=Number(newCost)||0;
  if(st.enabled)li.base_cost=(Number(li.base_cost)||0)-oldC+nC;
  st.costAmt=nC;
  li.charge_state[key]=st;
}
function setChargeAmt(li,key,newAmt){
  li.charge_state=li.charge_state||{};
  const st=li.charge_state[key]||{enabled:false,costAmt:0,amtAmt:0};
  const oldA=Number(st.amtAmt)||0,nA=Number(newAmt)||0;
  if(st.enabled)li.amount=(Number(li.amount)||0)-oldA+nA;
  st.amtAmt=nA;
  li.charge_state[key]=st;
}
function chargeToggleHTML(li,key){
  li.charge_state=li.charge_state||{};
  const st=li.charge_state[key]||{enabled:false,costAmt:0,amtAmt:0};
  li.charge_state[key]=st;
  return `<div class="charge-toggle-wrap">
    <div class="charge-toggle-head">
      <label class="charge-switch"><input type="checkbox" data-charge-enable="${esc(key)}"${st.enabled?' checked':''}><span class="switch-track"></span></label>
      <span class="charge-label">Additional charge</span>
    </div>
    <div class="charge-fields" style="display:${st.enabled?'flex':'none'}">
      <div class="charge-field"><span class="charge-field-label">Unit Cost</span><input type="number" class="charge-amt" data-charge-cost="${esc(key)}" value="${st.costAmt||0}" step="0.01" min="0" placeholder="0.00"></div>
      <div class="charge-field"><span class="charge-field-label">Amount ($)</span><input type="number" class="charge-amt" data-charge-amt="${esc(key)}" value="${st.amtAmt||0}" step="0.01" min="0" placeholder="0.00"></div>
      <div class="charge-field"><span class="charge-field-label">P / L</span><input type="number" class="charge-amt charge-pl ${((st.amtAmt||0)-(st.costAmt||0))>=0?'pl-pos':'pl-neg'}" data-charge-pl="${esc(key)}" value="${((st.amtAmt||0)-(st.costAmt||0)).toFixed(2)}" step="0.01" readonly></div>
    </div>
  </div>`;
}
function refreshChargePL(block,key,st){
  const el=block.querySelector(`[data-charge-pl="${key}"]`);
  if(!el)return;
  const pl=(Number(st.amtAmt)||0)-(Number(st.costAmt)||0);
  el.value=pl.toFixed(2);
  el.className='charge-amt charge-pl '+(pl>=0?'pl-pos':'pl-neg');
}

function computeRemarks(li){
  // Additional-charge amounts are populated directly into the Unit Cost /
  // Amount / P&L fields (see setChargeEnabled/setChargeCost/setChargeAmt) so
  // they flow into the totals automatically. The comment text itself stays
  // plain — no "(+$XXX)" suffix — to avoid duplicating that figure.
  const parts=[];
  if(li.comment_selected&&li.comment_selected.length)parts.push(...li.comment_selected);
  if(li.remarks_custom_list&&li.remarks_custom_list.length){
    li.remarks_custom_list.forEach(v=>{if(v&&v.trim())parts.push(v);});
  }
  li.remarks=parts.join('; ');
}
function buildCommentBlockHTML(li){
  const carp=isCarpentry(li);
  const hasOpts=li.comment_options&&li.comment_options.length>0;
  let optsHTML='';
  if(hasOpts){
    const opts=li.comment_options.map(o=>{
      const isChecked=(li.comment_selected||[]).includes(o);
      return `<div class="comment-opt-wrap"><label class="comment-opt"><input type="checkbox" data-comment-opt="${esc(o)}"${isChecked?' checked':''}><span>${esc(o)}</span></label>${(carp&&isChecked)?chargeToggleHTML(li,o):''}</div>`;
    }).join('');
    optsHTML=`<div class="comment-opts">${opts}</div>`;
  }
  const customRows=(li.remarks_custom_list||[]).map((v,i)=>`<div class="comment-row-wrap"><div class="comment-row"><input class="comment-txt" type="text" data-comment-custom-idx="${i}" value="${esc(v)}" placeholder="Custom comment…"><button type="button" class="btn-icon comment-remove" data-comment-remove-idx="${i}" title="Remove comment">✕</button></div>${carp?chargeToggleHTML(li,'custom-'+i):''}</div>`).join('');
  return `<div class="comment-block"><div class="comment-custom-list">${customRows}</div>${optsHTML}<button type="button" class="comment-add-btn" data-comment-add>+ Add comment</button></div>`;
}
function wireCommentBlock(row,li,rerenderFn){
  const block=row.querySelector('.comment-block');
  if(!block)return;
  block.querySelectorAll('[data-comment-opt]').forEach(cb=>{
    cb.addEventListener('change',e=>{
      const val=e.target.dataset.commentOpt;
      const carp=isCarpentry(li);
      li.comment_selected=li.comment_selected||[];
      if(e.target.checked){
        if(!li.comment_selected.includes(val))li.comment_selected.push(val);
      }else{
        li.comment_selected=li.comment_selected.filter(x=>x!==val);
        if(carp&&li.charge_state&&li.charge_state[val]&&li.charge_state[val].enabled){
          setChargeEnabled(li,val,false);
        }
      }
      computeRemarks(li);
      if(carp){
        // Re-render so the "Additional charge" toggle shows up only for
        // ticked comments (and disappears again if the comment is unticked).
        row.replaceWith(rerenderFn(li));
        updateSummary();
        return;
      }
    });
  });
  block.querySelectorAll('[data-comment-custom-idx]').forEach(inp=>{
    inp.addEventListener('input',e=>{
      const idx=parseInt(e.target.dataset.commentCustomIdx,10);
      li.remarks_custom_list[idx]=e.target.value;
      computeRemarks(li);
    });
  });
  block.querySelectorAll('[data-comment-remove-idx]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const idx=parseInt(btn.dataset.commentRemoveIdx,10);
      const key='custom-'+idx;
      if(isCarpentry(li)&&li.charge_state&&li.charge_state[key]&&li.charge_state[key].enabled){
        setChargeEnabled(li,key,false);
      }
      li.remarks_custom_list.splice(idx,1);
      if(li.charge_state){
        const reindexed={};
        Object.keys(li.charge_state).forEach(k=>{
          if(k.startsWith('custom-')){
            const oldIdx=parseInt(k.slice(7),10);
            if(oldIdx<idx)reindexed[k]=li.charge_state[k];
            else if(oldIdx>idx)reindexed['custom-'+(oldIdx-1)]=li.charge_state[k];
          }else reindexed[k]=li.charge_state[k];
        });
        li.charge_state=reindexed;
      }
      computeRemarks(li);
      row.replaceWith(rerenderFn(li));
      updateSummary();
    });
  });
  const addBtn=block.querySelector('[data-comment-add]');
  if(addBtn){
    addBtn.addEventListener('click',()=>{
      li.remarks_custom_list=li.remarks_custom_list||[];
      li.remarks_custom_list.push('');
      row.replaceWith(rerenderFn(li));
    });
  }
  block.querySelectorAll('[data-charge-enable]').forEach(cb=>{
    cb.addEventListener('change',e=>{
      const key=e.target.dataset.chargeEnable;
      setChargeEnabled(li,key,e.target.checked);
      const fieldsEl=e.target.closest('.charge-toggle-wrap').querySelector('.charge-fields');
      if(fieldsEl)fieldsEl.style.display=e.target.checked?'flex':'none';
      computeRemarks(li);
      syncAmountField(row,li);syncCostField(row,li);
      refreshChargePL(block,key,li.charge_state[key]);
      refreshPL(row,li);refreshTotalCost(row,li);refreshChargeNote(row,li);updateSummary();
    });
  });
  block.querySelectorAll('[data-charge-cost]').forEach(inp=>{
    inp.addEventListener('input',e=>{
      const key=e.target.dataset.chargeCost;
      setChargeCost(li,key,e.target.value);
      syncCostField(row,li);
      refreshChargePL(block,key,li.charge_state[key]);
      refreshPL(row,li);refreshTotalCost(row,li);refreshChargeNote(row,li);updateSummary();
    });
  });
  block.querySelectorAll('[data-charge-amt]').forEach(inp=>{
    inp.addEventListener('input',e=>{
      const key=e.target.dataset.chargeAmt;
      setChargeAmt(li,key,e.target.value);
      computeRemarks(li);
      syncAmountField(row,li);
      refreshChargePL(block,key,li.charge_state[key]);
      refreshPL(row,li);refreshTotalCost(row,li);refreshChargeNote(row,li);updateSummary();
    });
  });
}

function handleChange(e,li,row){

   BUILD PAYLOAD
