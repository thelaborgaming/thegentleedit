// Stores the original created_at when a quote is loaded for editing
let _loadedCreatedAt = null;
let _loadedVariationOrders = [];
// When true: only show included items in the line-item panel (load mode)
let _loadedView = false;

function buildPayload(){
  const active=lineItems.filter(li=>li.included&&(li.is_custom||(Number(li.qty)||0)>0));
  let totalAmt=0,totalCost=0;
  active.forEach(li=>{totalAmt+=lineAmountTotal(li);totalCost+=lineCostTotal(li);});
  const profit=totalAmt-totalCost,margin=totalAmt>0?(profit/totalAmt)*100:0;
  return{
    project:{quote_ref:document.getElementById('quoteRef').value.trim(),salesperson:document.getElementById('salesperson').value.trim(),client_name:document.getElementById('clientName').value.trim(),phone:document.getElementById('phone').value.trim(),client_email:document.getElementById('clientEmail').value.trim(),property_type:document.getElementById('propertyType').value,project_address:document.getElementById('projectAddress').value.trim(),notes:document.getElementById('notes').value.trim()},
    summary:{total_amount:+totalAmt.toFixed(2),total_cost:+totalCost.toFixed(2),total_profit:+profit.toFixed(2),margin_pct:+margin.toFixed(2)},
    line_items:active.map(li=>{const q=Number(li.qty)||1;return{line_id:li.id,item_id:li.item_id||'custom',item_name:li.item_name,category_id:li.category_id,area_id:li.area_id,qty:q,unit:li.unit||'lot',width_mm:li.width_mm||null,height_mm:li.height_mm||null,cost:+lineCostTotal(li).toFixed(2),markup_pct:Number(li.markup_pct)||0,amount:+lineAmountTotal(li).toFixed(2),pl:+calcPL(li).toFixed(2),included_by_default:!!li.included_by_default,is_custom:!!li.is_custom,remarks:li.remarks||'',charges:getActiveCharges(li)};}),
    // Preserve original created_at when re-submitting an edited quote
    created_at: _loadedCreatedAt || null,
    // Preserve any Variation Orders the loaded quote already had — Submit replaces the
    // whole saved row, so without this a resubmit after signing would silently wipe them.
    variation_orders: _loadedVariationOrders || [],
  };
}

/* ══════════════════════════════════════════════════════
   LOAD EXISTING QUOTE via Quote Ref → n8n
   Your n8n workflow should:
   1. Receive GET ?ref=QT-xxx
   2. Look up the row in Google Sheets by quote_ref
   3. Return the same JSON structure as buildPayload()
══════════════════════════════════════════════════════ */
async function loadQuote(){
  const ref=document.getElementById('loadRef').value.trim();
  if(!ref){setStatus('error','Enter a Quote Ref first.');return;}
  if(!CONFIG.loadUrl||CONFIG.loadUrl==='PASTE_YOUR_LOAD_QUOTE_WEBHOOK_URL_HERE'){
    setStatus('error','loadUrl not configured in CONFIG.');return;
  }
  setStatus('loading','Loading quote '+ref+'…');
  try{
    const res=await fetch(CONFIG.loadUrl+'?ref='+encodeURIComponent(ref));
    if(!res.ok)throw new Error('HTTP '+res.status);
    let data=await res.json();
    // Defensive: if webhook returns an array of matching rows (e.g. multiple
    // saved drafts for the same quote_ref), always pick the most recently
    // updated/created one instead of whatever the sheet returns first.
    if(Array.isArray(data)){
      if(data.length===0) throw new Error('No quote found for ref '+ref);
      data=data.slice().sort((a,b)=>{
        const ta=new Date(a.updated_at||a.created_at||0).getTime();
        const tb=new Date(b.updated_at||b.created_at||0).getTime();
        return tb-ta;
      })[0];
    }
    console.log('[loadQuote] received:', JSON.stringify(data).substring(0,400));
    populateFromPayload(data);
    const ver=data.version>1?` (v${data.version})`:'';
    const upd=data.updated_at?` · saved ${new Date(data.updated_at).toLocaleString('en-SG')}`:'' ;
    setStatus('success','Loaded: '+ref+ver+upd);
  }catch(e){setStatus('error','Load failed: '+e.message);}
}

function populateFromPayload(data){
  // Capture original created_at so re-submits preserve it
  _loadedCreatedAt = data.created_at || null;
  // Capture any existing Variation Orders so re-submits preserve them too
  _loadedVariationOrders = data.variation_orders || [];
  document.getElementById('tabVo').style.display = _loadedVariationOrders.length ? '' : 'none';
  // Project fields
  const p=data.project||{};
  document.getElementById('quoteRef').value=p.quote_ref||'';
  document.getElementById('salesperson').value=p.salesperson||'';
  document.getElementById('clientName').value=p.client_name||'';
  document.getElementById('phone').value=p.phone||'';
  document.getElementById('clientEmail').value=p.client_email||'';
  document.getElementById('propertyType').value=p.property_type||'';
  document.getElementById('projectAddress').value=p.project_address||'';
  document.getElementById('notes').value=p.notes||'';
  // Rebuild line items from saved payload only — no defaults
  _loadedView = true;
  catCollapsed.clear();areaCollapsed.clear();
  initLineItems();
  lineItems.forEach(li=>{ li.included=false; }); // clear all catalog defaults
  const saved=data.line_items||[];
  saved.forEach(saved_li=>{
    if(saved_li.is_custom){
      lineItems.push({id:uid(),item_id:'custom',is_custom:true,included:true,category_id:saved_li.category_id||'CUSTOM',area_id:saved_li.area_id||'',item_name:saved_li.item_name||'',unit:saved_li.unit||'lot',qty:saved_li.qty||1,base_cost:(saved_li.cost||0)/(saved_li.qty||1),markup_pct:saved_li.markup_pct||0,amount:(saved_li.amount||0)/(saved_li.qty||1),has_dimensions:!!(saved_li.width_mm||saved_li.height_mm),width_mm:saved_li.width_mm||null,height_mm:saved_li.height_mm||null,comment_options:[],remarks:saved_li.remarks||'',remarks_is_custom:false,comment_selected:[],remarks_custom_list:saved_li.remarks?[saved_li.remarks]:[],included_by_default:false});
    }else{
      let match=lineItems.find(li=>li.item_id===saved_li.item_id||li.item_name===saved_li.item_name);
      if(!match){
        // Item wasn't a default (is_default:false in catalog) so it wasn't
        // pre-built by initLineItems(). Look it up in the full catalog instead
        // of silently dropping it.
        const catEntry=catalog.find(c=>slugify(c.item_name)===saved_li.item_id||c.item_name===saved_li.item_name);
        if(catEntry){
          match=makeLI(catEntry,false);
          lineItems.push(match);
        }
      }
      if(match){
        const nz=(v,fallback)=> (v===null||v===undefined) ? fallback : v; // preserve legitimate 0 values
        match.included=true;
        match.qty=nz(saved_li.qty,match.qty);
        match.base_cost=nz(saved_li.cost,null)!==null ? (saved_li.cost/(saved_li.qty||1)) : match.base_cost;
        match.markup_pct=nz(saved_li.markup_pct,match.markup_pct);
        match.amount=nz(saved_li.amount,null)!==null ? (saved_li.amount/(saved_li.qty||1)) : match.amount;
        match.width_mm=nz(saved_li.width_mm,match.width_mm);
        match.height_mm=nz(saved_li.height_mm,match.height_mm);
        match.remarks=nz(saved_li.remarks,match.remarks);
        match.comment_selected=(match.comment_options||[]).filter(o=>(saved_li.remarks||'').split(';').map(s=>s.trim()).includes(o));
        const extra=(saved_li.remarks||'').split(';').map(s=>s.trim()).filter(s=>s&&!(match.comment_options||[]).includes(s));
        match.remarks_custom_list=extra;
      }
    }
  });
  renderLineItems();
}

/* ══════════════════════════════════════════════════════
   PREVIEW DOCUMENT BUILDER
   mode: 'designer' → shows markup + P/L columns
   mode: 'customer' → hides markup + P/L
══════════════════════════════════════════════════════ */
function buildDocHTML(payload, mode){
  const p=payload.project,s=payload.summary,items=payload.line_items;
  const isDesigner=(mode==='designer');

  const catMap={};
  items.forEach(li=>{
    const c=li.category_id||'General',a=li.area_id||'General';
    if(!catMap[c])catMap[c]={};
    if(!catMap[c][a])catMap[c][a]=[];
    catMap[c][a].push(li);
  });

  const colCount=isDesigner?8:6;

  let rowsHTML='',num=1;
  const catTotalsArr=[]; // {cat, sum} — reused by the per-category subtotal row and the Summary page below
  Object.entries(catMap).forEach(([cat,areas])=>{
    rowsHTML+=`<tr class="doc-cat-row"><td colspan="${colCount}">${esc(cat)}</td></tr>`;
    let catSum=0;
    const akeys=Object.keys(areas);
    akeys.forEach(area=>{
      if(akeys.length>1)rowsHTML+=`<tr class="doc-area-row"><td colspan="${colCount}">↳ ${esc(area)}</td></tr>`;
      areas[area].forEach(li=>{
        const dim=(li.width_mm&&li.height_mm)?`L:${li.width_mm}mm × H:${li.height_mm}mm`:(li.width_mm?`W:${li.width_mm}mm`:'');
        const chargeAmtSum=(li.charges||[]).reduce((s,c)=>s+c.amt,0);
        const unitAmt=li.qty?(li.amount-chargeAmtSum)/li.qty:(li.amount-chargeAmtSum);
        const plVal=li.amount-(li.cost||0);
        const remarkLines=li.remarks?li.remarks.split(';').map(r=>r.trim()).filter(Boolean):[];
        const remarkHTML=remarkLines.map(r=>`<div class="doc-item-remark">↳ ${esc(r)}</div>`).join('');

        // Additional-charge figures sit in the same row, stacked one line
        // per comment so they land to the right of that comment (no
        // separate row) — a blank filler line keeps un-charged comments
        // from throwing off the alignment.
        const chargesByLabel={};
        (li.charges||[]).forEach(ch=>{chargesByLabel[ch.label]=ch;});
        const hasCharges=!!(li.charges&&li.charges.length);
        function chargeLine(v,isPL){
          if(v===null||v===undefined)return`<div class="doc-item-charge-val">&nbsp;</div>`;
          if(isPL){
            const col=v>=0?'#2E7D32':'#C62828';
            return`<div class="doc-item-charge-val" style="color:${col}">${v>=0?'+':'−'}${fmt(Math.abs(v))}</div>`;
          }
          return`<div class="doc-item-charge-val">${v>=0?'':'−'}${fmt(Math.abs(v))}</div>`;
        }
        function chargeCol(getter,isPL){
          if(!hasCharges)return'';
          return remarkLines.map(r=>chargeLine(chargesByLabel[r]?getter(chargesByLabel[r]):null,isPL)).join('');
        }

        rowsHTML+=`<tr>
          <td style="color:#9E8E82;font-family:monospace;font-size:9.5px;width:22px">${num++}</td>
          <td><div class="doc-item-name">${esc(li.item_name)}</div>
            ${dim?`<div class="doc-item-dim">📐 ${esc(dim)}</div>`:''}
            ${remarkHTML}</td>
          <td class="r" style="width:38px">${li.qty}</td>
          <td style="width:44px">${esc(li.unit||'lot')}</td>
          <td class="r" style="width:72px">${fmt(unitAmt)}${chargeCol(ch=>ch.amt)}</td>
          ${isDesigner?`<td class="r" style="width:72px">${fmt(li.cost||0)}${chargeCol(ch=>ch.cost)}</td>`:''}
          <td class="r" style="width:78px;font-weight:600">${fmt(li.amount)}${chargeCol(ch=>ch.amt)}</td>
          ${isDesigner?`<td class="r" style="width:72px;color:${plVal>=0?'#2E7D32':'#C62828'};font-weight:600">${(plVal>=0?'+':'')+fmt(plVal)}${chargeCol(ch=>(ch.amt-ch.cost),true)}</td>`:''}
        </tr>`;
        catSum+=li.amount;
      });
    });
    rowsHTML+=`<tr class="doc-cat-subtotal"><td colspan="${colCount-1}" style="text-align:right">Sub-total:</td><td class="r">${fmt(catSum)}</td></tr>`;
    catTotalsArr.push({cat,sum:catSum});
  });

  const profCol=s.total_profit>=0?'#2E7D32':'#C62828';
  const totalsRows=isDesigner?`
    <tr><td class="tl">Total Cost</td><td class="tv">${fmt(s.total_cost)}</td></tr>
    <tr><td class="tl">Total P/L</td><td class="tv" style="color:${profCol}">${fmt(s.total_profit)}</td></tr>
    <tr><td class="tl">Margin</td><td class="tv">${pct(s.margin_pct)}</td></tr>
    <tr class="grand"><td class="tl">TOTAL AMOUNT</td><td class="tv">${fmt(s.total_amount)}</td></tr>`:`
    <tr class="grand"><td class="tl">TOTAL AMOUNT</td><td class="tv">${fmt(s.total_amount)}</td></tr>`;

  // Summary page — category rollup + Sub-total/Goodwill Discount/Grand Total.
  // Goodwill Discount isn't a field the builder collects yet, so it defaults to 0 and
  // the row is simply omitted for ordinary quotes rather than showing a redundant $0.00.
  const summaryRowsHTML=catTotalsArr.map((c,i)=>`<tr><td class="num">${i+1}</td><td>${esc(c.cat.charAt(0)+c.cat.slice(1).toLowerCase())}</td><td class="amt">${fmt(c.sum)}</td></tr>`).join('');
  const summarySubTotal=catTotalsArr.reduce((a,c)=>a+c.sum,0);
  const goodwillDiscount=Number(p.goodwill_discount||s.goodwill_discount||0);
  const summaryGrandTotal=summarySubTotal-goodwillDiscount;
  const discountRowHTML=goodwillDiscount?`<tr class="sub"><td colspan="2" style="text-align:right">GOODWILL DISCOUNT:</td><td class="amt">-${fmt(goodwillDiscount)}</td></tr>`:'';
  const today=new Date().toLocaleDateString('en-SG',{day:'2-digit',month:'short',year:'numeric'});

  return`<div class="doc${isDesigner?' designer-copy':''}" style="position:relative">
    <div class="doc-letterhead">
      <div class="doc-logo-wrap">
        ${LOGO_B64?`<img class="doc-logo" src="${LOGO_B64}">`:LOGO_SVG}
        <div class="doc-co-name">${esc(CONFIG.companyName)}</div>
        <div class="doc-co-reg">${esc(CONFIG.companyReg)} &nbsp;|&nbsp; ${esc(CONFIG.address)}</div>
        </div>
      <div class="doc-ref-col">
        <div class="doc-ref-box">
          <div class="doc-ref-label">Quotation Ref</div>
          <div class="doc-ref-val">${esc(p.quote_ref||'DRAFT')}</div>
        </div>
        <div style="margin-top:6px"><span class="doc-copy-badge">${isDesigner?'DESIGNER COPY':'CUSTOMER COPY'}</span></div>
        <div style="font-size:9.5px;color:#9E8E82;margin-top:6px">Date: ${new Date().toLocaleDateString('en-SG',{day:'2-digit',month:'short',year:'numeric'})}</div>
      </div>
    </div>

    <div class="doc-client-grid">
      <div class="doc-client-row"><span class="doc-client-label">Client</span><span class="doc-client-val">${esc(p.client_name||'—')}</span></div>
      <div class="doc-client-row"><span class="doc-client-label">Salesperson</span><span class="doc-client-val">${esc(p.salesperson||'—')}</span></div>
      <div class="doc-client-row"><span class="doc-client-label">Phone</span><span class="doc-client-val">${esc(p.phone||'—')}</span></div>
      <div class="doc-client-row"><span class="doc-client-label">Address</span><span class="doc-client-val">${esc(p.project_address||'—')}</span></div>
    </div>

    <div class="doc-section-title">Line Items</div>
    <table class="doc-table">
      <thead><tr>
        <th style="width:22px">#</th><th>Description</th>
        <th class="r" style="width:38px">Qty</th>
        <th style="width:44px">Unit</th>
        <th class="r" style="width:72px">Unit Amt</th>
        ${isDesigner?'<th class="r" style="width:72px">Total Cost</th>':''}
        <th class="r" style="width:78px">Total</th>
        ${isDesigner?'<th class="r" style="width:72px">P / L</th>':''}
      </tr></thead>
      <tbody>${rowsHTML}</tbody>
    </table>

    <div class="doc-totals-wrap">
      <table class="doc-totals-table"><tbody>${totalsRows}</tbody></table>
    </div>

    ${p.notes?`<div class="doc-notes-wrap"><strong style="font-size:9px;text-transform:uppercase;letter-spacing:.08em;color:#B8945A">Notes</strong><br>${esc(p.notes)}</div>`:''}

    <div class="doc-footer">
      <div>${esc(CONFIG.companyName)} &nbsp;·&nbsp; ${esc(CONFIG.phone)} &nbsp;·&nbsp; ${esc(CONFIG.email)}</div>
      <div>This quotation is valid for 30 days from date of issue.</div>
    </div>

    <div class="doc-summary">
      <div class="doc-summary-title">Summary</div>
      <table class="doc-summary-table"><tbody>
        ${summaryRowsHTML}
        <tr class="sub"><td colspan="2" style="text-align:right">SUB-TOTAL:</td><td class="amt">${fmt(summarySubTotal)}</td></tr>
        ${discountRowHTML}
        <tr class="grand"><td colspan="2" style="text-align:right">GRAND TOTAL:</td><td class="amt">${fmt(summaryGrandTotal)}</td></tr>
      </tbody></table>
      <div class="doc-sign-grid">
        <div class="doc-sign-col">
          <div class="doc-sign-label">Signature — ${esc(CONFIG.companyName)}</div>
          <div class="doc-sign-pad"></div>
          <div class="doc-sign-name">${esc(CONFIG.companyName)}</div>
          <div class="doc-sign-date">Date: <b>${today}</b></div>
        </div>
        <div class="doc-sign-col">
          <div class="doc-sign-label">Signature — Client</div>
          <div class="doc-sign-pad"></div>
          <div class="doc-sign-name">${esc(p.client_name||'—')}</div>
          <div class="doc-sign-date">Date: <b>${today}</b></div>
        </div>
      </div>
    </div>
  </div>`+buildTermsHTML(payload);
}

/* ══════════════════════════════════════════════════════
   TERMS & CONDITIONS PAGE
   Payment split is computed live off payload.summary.total_amount,
   so it always matches this specific quotation's grand total.
══════════════════════════════════════════════════════ */
function buildTermsHTML(payload){
  const p=payload.project,s=payload.summary;
  // Payment schedule is based on the actual amount owed (after any Goodwill Discount),
  // matching the Grand Total on the Summary page above, not the pre-discount line-items total.
  const discount=Number(p.goodwill_discount||s.goodwill_discount||0);
  const total=(s.total_amount||0)-discount;
  const letters=['A','B','C','D','E','F','G','H'];
  const payRowsHTML=CONFIG.paymentTerms.map((t,i)=>{
    const amt=total*(t.pct/100);
    return`<div class="doc-tc-payrow"><span>${letters[i]||i+1}) ${esc(t.label)}</span><span class="doc-tc-amt">${fmt(amt)}</span></div>`;
  }).join('');
  const co=esc(CONFIG.companyName);
  const threshold=fmt(CONFIG.managementCountersignThreshold).replace(/\.00$/,'');
  const today=new Date().toLocaleDateString('en-SG',{day:'2-digit',month:'short',year:'numeric'});

  // 10 clauses — same scope/order as the original, wording refined using the clearer
  // phrasing from the 22-clause revised draft (grace period + interest rate on late
  // payment, concrete Defects Inspection Period, mm-tolerance on fabrication, GST
  // contingency, portfolio/marketing photo carve-out). One addition beyond a pure
  // reword: clause 6 now also covers electronic-signature validity, since that's
  // directly relevant to how this document is actually signed.
  const tcClauses=[
    `The Contract Sum shall be paid by the Client to ${co} in accordance with the following progressive payment schedule ("Progress Payments"), which shall be strictly adhered to:<div class="doc-tc-pay">${payRowsHTML}</div>`,
    `Time is of the essence in respect of all payment obligations. If any Progress Payment is not received within seven (7) days of its due date, ${co} may suspend all Works until the outstanding sum, together with interest at 1.5% per month (or part thereof) on the overdue amount, is received in full. ${co} shall not be liable for any loss or delay arising from such suspension, and the Completion Date shall be extended accordingly.`,
    `All payments shall be made by cheque payable to "${co}", by bank transfer, or via PayNow to our ${esc(CONFIG.companyReg)}, with the project address indicated as reference. ${co} shall not be liable for any cash or cheque payment made to, or handed to, any representative unless made at ${co}'s registered office against an official receipt issued under authorised signature and company stamp. A payment shall be deemed received only upon actual receipt of cleared funds.`,
    `Any works, materials, finishes or specifications not expressly included in this Agreement shall constitute a variation ("Variation"). No Variation shall be carried out on verbal instruction alone; all Variations must be recorded in a written Variation Order specifying the additional scope and cost, and confirmed by both parties before the varied Works commence.`,
    `Upon completion of the Works, ${co} shall notify the Client in writing and both parties shall jointly inspect the premises. Any defects, incomplete items, or touch-ups required shall be recorded in a joint inspection list. The Client shall notify ${co} in writing of any such items within seven (7) days of handover (the "Defects Inspection Period"); save for items validly notified within this period, the Works shall be deemed accepted, save for ${co}'s standard workmanship warranty (if any) separately provided.`,
    `This Quotation is valid for thirty (30) days from its date of issue. This Agreement shall only become valid and binding upon execution by both the Client and an authorised representative of ${co}, including by electronic or digital signature affixed via ${co}'s online quotation acceptance platform, in accordance with the Electronic Transactions Act 2010. For any Contract Sum exceeding ${threshold}, this Agreement shall additionally require countersignature by a member of ${co}'s management.`,
    `Any perspective drawings or visualisations presented are artist's impressions provided solely to assist the Client in visualising the proposed design concept and do not form part of the contractual specification. Variance between a perspective and the actual as-built condition may arise from factors including printing, site constraints, and materials selected, and shall not be construed as a defect or breach of this Agreement.`,
    `Any fabrication drawings or dimensions presented are indicative and serve as a guide only. Actual as-built dimensions may vary from those indicated within normal trade tolerances (typically up to 10mm) due to site conditions and standard fabrication tolerances; such variance shall not constitute a defect or breach of this Agreement.`,
    `${co} is not currently registered for the Goods and Services Tax (GST); all prices stated are therefore nett. In the event ${co} becomes GST-registered prior to completion of the Works, GST shall be added to any sums not yet invoiced, at the prevailing rate.`,
    `The terms of this Agreement, including pricing, are confidential between the parties and shall not be disclosed to any third party, save where required by law. Notwithstanding the foregoing, ${co} may photograph and/or video the Works, in progress and upon completion, for its own portfolio and marketing purposes, unless the Client objects in writing prior to handover.`,
  ];
  const tcListHTML=tcClauses.map(c=>`<li>${c}</li>`).join('');

  return`<div class="doc doc-tc">
    <div class="doc-tc-header">
      <div class="doc-tc-title">Terms &amp; Conditions</div>
      <div class="doc-tc-ref">Ref: ${esc(p.quote_ref||'DRAFT')}</div>
    </div>
    <ol class="doc-tc-list">${tcListHTML}</ol>

    <div class="doc-sign-grid tc">
      <div class="doc-sign-col">
        <div class="doc-sign-label">Signature — Authorised Representative</div>
        <div class="doc-sign-pad"></div>
        <div class="doc-sign-name">${co}<span class="doc-sign-role"><br>Company Stamp</span></div>
        <div class="doc-sign-date">Date: <b>${today}</b></div>
      </div>
      <div class="doc-sign-col">
        <div class="doc-sign-label">Signature — Client</div>
        <div class="doc-sign-pad"></div>
        <div class="doc-sign-name">${esc(p.client_name||'—')}</div>
        <div class="doc-sign-date">Date: <b>${today}</b></div>
      </div>
    </div>
  </div>`;
}

/* ══════════════════════════════════════════════════════
   VARIATION ORDERS — preview tab
   Scaffold only: there is no VO data-entry UI in this file yet,
   so payload.variation_orders is always [] today and this tab
   stays hidden. Once VOs can actually be added, each entry is
   expected in this shape:
     { vo_ref, date_raised, reason, requested_by, status,
       vo_value, revised_contract_sum, signature_data, approved_at,
       line_items: [ ...same shape as a normal line item, plus change_type... ] }
══════════════════════════════════════════════════════ */
function buildVoHTML(payload){
  const vos=payload.variation_orders||[];
  const p=payload.project;
  if(!vos.length){
    return`<div class="doc"><div class="doc-section-title">Variation Orders</div><p style="font-size:12px;color:#6B5E52;padding:20px 0">No Variation Orders have been added to this quotation yet.</p></div>`;
  }
  const voHTML=vos.map(vo=>{
    const items=vo.line_items||[];
    const rows=items.map(li=>`<tr>
      <td style="width:70px;text-transform:uppercase;font-size:10px;color:#9E8E82">${esc(li.change_type||'—')}</td>
      <td><div class="doc-item-name">${esc(li.item_name||'')}</div></td>
      <td class="r" style="width:38px">${li.qty||''}</td>
      <td class="r" style="width:78px;font-weight:600">${fmt(li.amount||0)}</td>
    </tr>`).join('');
    return`<div class="doc-summary" style="margin-top:26px">
      <div class="doc-summary-title" style="text-decoration:none;font-size:12px">${esc(vo.vo_ref||'VO')} — ${esc(vo.status||'draft')}</div>
      <div class="doc-client-grid">
        <div class="doc-client-row"><span class="doc-client-label">Date</span><span class="doc-client-val">${esc(vo.date_raised||'—')}</span></div>
        <div class="doc-client-row"><span class="doc-client-label">Reason</span><span class="doc-client-val">${esc(vo.reason||'—')}</span></div>
      </div>
      <table class="doc-table"><thead><tr><th>Type</th><th>Description</th><th class="r">Qty</th><th class="r">Amount</th></tr></thead><tbody>${rows}</tbody></table>
      <div class="doc-totals-wrap"><table class="doc-totals-table"><tbody>
        <tr><td class="tl">This VO Value</td><td class="tv">${fmt(vo.vo_value||0)}</td></tr>
        <tr class="grand"><td class="tl">Revised Contract Sum</td><td class="tv">${fmt(vo.revised_contract_sum||0)}</td></tr>
      </tbody></table></div>
    </div>`;
  }).join('');
  return`<div class="doc"><div class="doc-section-title">Variation Orders — ${esc(p.quote_ref||'DRAFT')}</div>${voHTML}</div>`;
}

function buildStandaloneDocHTML(payload, mode){
  const fragment = buildDocHTML(payload, mode);
  return `<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><style>${DOC_STYLE_CSS}</style></head><body>${fragment}</body></html>`;
}

/* ══════════════════════════════════════════════════════
   PREVIEW MODAL
══════════════════════════════════════════════════════ */
function renderPreviewMode(payload,mode){
  return mode==='vo' ? buildVoHTML(payload) : buildDocHTML(payload,mode);
}
function openPreview(){
  const payload=buildPayload();
  document.getElementById('tabVo').style.display=payload.variation_orders.length?'':'none';
  document.getElementById('previewBody').innerHTML=renderPreviewMode(payload,previewMode);
  document.getElementById('previewOverlay').classList.add('open');
}
function switchTab(mode){
  previewMode=mode;
  document.querySelectorAll('.ptab').forEach(t=>t.classList.toggle('active',t.dataset.copy===mode));
  const payload=buildPayload();
  document.getElementById('previewBody').innerHTML=renderPreviewMode(payload,mode);
}
document.querySelectorAll('.ptab').forEach(t=>t.addEventListener('click',()=>switchTab(t.dataset.copy)));
document.getElementById('btnPreview').addEventListener('click',openPreview);
document.getElementById('mtbPreviewBtn').addEventListener('click',openPreview);
document.getElementById('previewClose').addEventListener('click',()=>document.getElementById('previewOverlay').classList.remove('open'));
document.getElementById('previewCloseBtn').addEventListener('click',()=>document.getElementById('previewOverlay').classList.remove('open'));
document.getElementById('previewOverlay').addEventListener('click',e=>{if(e.target===e.currentTarget)e.currentTarget.classList.remove('open');});


/* ══════════════════════════════════════════════════════
   SUBMIT
══════════════════════════════════════════════════════ */
function setStatus(state,msg){
  document.getElementById('statusRow').className='status-row s-'+state;
  document.getElementById('statusText').textContent=msg;
}
async function doSubmit(){
  if(!CONFIG.webhookUrl||CONFIG.webhookUrl==='PASTE_YOUR_WEBHOOK_URL_HERE'){
    setStatus('error','Webhook URL not configured.');
    console.log('Payload:',JSON.stringify(buildPayload(),null,2));return;
  }
  const btnIds=['btnSubmit','previewSubmitBtn','btnSaveDraft'];
  btnIds.forEach(id=>{const el=document.getElementById(id);if(el)el.disabled=true;});
  try{
    setStatus('loading','Submitting…');
    const payload=buildPayload();
    payload.html_customer=buildStandaloneDocHTML(payload,'customer');
    payload.html_designer=buildStandaloneDocHTML(payload,'designer');
    payload.mode='submit';
    const res=await fetch(CONFIG.webhookUrl,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    if(res.ok){
      let resp={};try{resp=await res.json();}catch(_){}
      const ref=resp.quote_ref||payload.project.quote_ref||'';
      setStatus('success',`Submitted ✓${ref?' — '+ref:''}`);
      if(resp.quote_ref)document.getElementById('quoteRef').value=resp.quote_ref;
      document.getElementById('previewOverlay').classList.remove('open');
    }else setStatus('error',`Error ${res.status}: ${res.statusText}`);
  }catch(e){setStatus('error','Error — '+e.message);}
  finally{btnIds.forEach(id=>{const el=document.getElementById(id);if(el)el.disabled=false;});}
}
async function doSaveDraft(){
  const draftUrl=CONFIG.draftUrl||CONFIG.webhookUrl;
  if(!draftUrl||draftUrl==='PASTE_YOUR_WEBHOOK_URL_HERE'){
    setStatus('error','Webhook URL not configured.');
    console.log('Draft Payload:',JSON.stringify(buildPayload(),null,2));return;
  }
  const btnIds=['btnSubmit','previewSubmitBtn','btnSaveDraft'];
  btnIds.forEach(id=>{const el=document.getElementById(id);if(el)el.disabled=true;});
  try{
    setStatus('loading','Saving draft…');
    const payload=buildPayload();
    payload.html_customer=buildStandaloneDocHTML(payload,'customer');
    payload.html_designer=buildStandaloneDocHTML(payload,'designer');
    payload.mode='draft';
    const res=await fetch(draftUrl,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    if(res.ok){
      let resp={};try{resp=await res.json();}catch(_){}
      const ref=resp.quote_ref||payload.project.quote_ref||'';
      setStatus('success',`Draft saved ✓${ref?' — '+ref:''}`);
      if(resp.quote_ref)document.getElementById('quoteRef').value=resp.quote_ref;
    }else setStatus('error',`Error ${res.status}: ${res.statusText}`);
  }catch(e){setStatus('error','Error — '+e.message);}
  finally{btnIds.forEach(id=>{const el=document.getElementById(id);if(el)el.disabled=false;});}
}
document.getElementById('btnSubmit').addEventListener('click',doSubmit);
document.getElementById('previewSubmitBtn').addEventListener('click',doSubmit);
document.getElementById('btnSaveDraft').addEventListener('click',doSaveDraft);
document.getElementById('btnLoad').addEventListener('click',loadQuote);

document.getElementById('themeToggle').addEventListener('click',()=>{
  const dark=document.documentElement.getAttribute('data-theme')==='dark';
  document.documentElement.setAttribute('data-theme',dark?'light':'dark');
  document.getElementById('themeIcon').textContent=dark?'☀️':'🌙';
  document.getElementById('themeLabel').textContent=dark?'Light':'Dark';
});
document.getElementById('btnDefaults').addEventListener('click',insertDefaults);
document.getElementById('btnRemoveAll').addEventListener('click',removeAllItems);
document.getElementById('btnClear').addEventListener('click',()=>{
  ['quoteRef','salesperson','clientName','phone','clientEmail','projectAddress','notes'].forEach(id=>{
    const el=document.getElementById(id); if(el) el.value='';
  });
  document.getElementById('propertyType').value='';
  document.getElementById('loadRef').value='';
  _loadedCreatedAt=null;
  _loadedVariationOrders=[];
  document.getElementById('tabVo').style.display='none';
  _loadedView=false;
  catCollapsed.clear();areaCollapsed.clear();
  initLineItems();
  setStatus('idle','Ready');
});
document.getElementById('btnAddCustom').addEventListener('click',addCustomItem);

// Global cart — commit all pending items at once
document.getElementById('btnAddPending').addEventListener('click',()=>{
  if(!pendingItems.size)return;
  addFromPicker(Array.from(pendingItems.values()));
  pendingItems.clear();
  updatePendingButton();
});

// Expand / Collapse all
document.getElementById('btnExpandAll').addEventListener('click',()=>{
  document.querySelectorAll('.cat-section').forEach(el=>{el.classList.remove('collapsed');catCollapsed.set(el.dataset.catId,false);});
  document.querySelectorAll('.area-sub').forEach(el=>{el.classList.remove('collapsed');areaCollapsed.set(el.dataset.catId+'::'+el.dataset.areaId,false);});
});
document.getElementById('btnCollapseAll').addEventListener('click',()=>{
  document.querySelectorAll('.cat-section').forEach(el=>{el.classList.add('collapsed');catCollapsed.set(el.dataset.catId,true);});
  document.querySelectorAll('.area-sub').forEach(el=>{el.classList.add('collapsed');areaCollapsed.set(el.dataset.catId+'::'+el.dataset.areaId,true);});
});
